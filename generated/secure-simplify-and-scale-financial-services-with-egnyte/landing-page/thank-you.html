<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you! | Secure, Simplify, and Scale Financial Services with Egnyte</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/style.css">

</head>
<body class="ty-page">
<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="#" target="_blank" rel="noopener" class="logo-link"><img src="assets/logo.png" alt="Logo" class="logo"></a>
    <div class="partner">
      <img src="assets/partner-logo.png" alt="valasys" class="partner-logo">
    </div>
  </div>
</header>

<section class="banner banner-slim">
  <img src="assets/banner.jpg" alt="Egnyte Solution Brief">
</section>


<main class="container ty-wrap">
  <div class="ty-card">
    <div class="ty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>Thank you!</h1>
    <div class="rich"></div>
    <a id="pdf-link" class="btn" href="assets/Product-Brief-Secure-Simplify-and-Scale-Financial-Services-With-Egnyte-1.pdf" download="Product-Brief-Secure-Simplify-and-Scale-Financial-Services-With-Egnyte-1.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Download the PDF
    </a>
    <p class="ty-note" id="ty-note">Your download will start automatically. If it doesn't, click the button above.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
<img src="assets/logo.png" alt="Logo" class="footer-logo boxed">      <p class="footer-contact">
      </p>
    </div>
    <div class="footer-links">
    </div>
  </div>
  <div class="footer-bottom">
    <div class="container"></div>
  </div>
</footer>

<script>
  // Download the PDF as soon as the thank-you page opens.
  (function () {
    var link = document.getElementById('pdf-link');
    if (new URLSearchParams(location.search).get('preview') === '1') return; // builder preview
    var name = link.getAttribute('download');

    function saveBlob(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
    }

    function autoDownload() {
      // fetch + blob forces a real download (not an inline PDF view) when served over http(s).
      if (location.protocol.indexOf('http') === 0 && window.fetch) {
        fetch(link.href).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.blob();
        }).then(saveBlob).catch(function () { link.click(); });
      } else {
        link.click();
      }
      document.getElementById('ty-note').textContent = 'Your download has started. If it didn’t, click the button above.';
    }

    setTimeout(autoDownload, 500);
  })();
</script>
</body>
</html>
